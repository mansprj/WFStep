appId: com.wfstep.app
publish:
  provider: github
  owner: mansprj
  repo: WFStep
  releaseType: release
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - resources/**
  - package.json
asar: true
asarUnpack:
  - "**/node_modules/@koromix/**"
  - "**/node_modules/koffi/vendor/**"
win:
  target:
    - nsis
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: wfstep
  runAfterFinish: true
